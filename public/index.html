<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件收集</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <section class="hero">
    <h1><span id="verb">收集</span><em>文件</em></h1>
    <div class="seg" id="mode" role="tablist">
      <button type="button" role="tab" data-kind="c">收集</button>
      <button type="button" role="tab" data-kind="d">分发</button>
    </div>
  </section>

  <div class="grid2">
    <form class="card" id="create">
      <h2>发起</h2>
      <input type="text" id="title" placeholder="名字（英文或数字）" aria-label="名字" maxlength="32" pattern="[A-Za-z0-9]+" title="只能是英文字母或数字，无空格" required autocomplete="off">
      <button class="btn primary block" id="createBtn">创建</button>
    </form>
    <form class="card" id="join">
      <h2>加入</h2>
      <input type="text" id="code" placeholder="链接或名字" aria-label="链接或名字" required autocomplete="off">
      <button class="btn block">加入</button>
    </form>
  </div>

  <section id="recent" hidden>
    <div class="section-title"><h2>最近</h2></div>
    <div class="rows" id="list"></div>
  </section>
</main>
<script type="module">
import { $, h, icon, brand, toast } from '/ui.js';

const top = brand();
$('top').append(top);

// c = collection, d = distribution; same name rules, separate namespaces.
const KINDS = {
  c: { verb: '收集', api: '/api/collections' },
  d: { verb: '分发', api: '/api/distributions' },
};
let kind = 'c';
try { if (localStorage.getItem('kind') === 'd') kind = 'd'; } catch {}

function setKind(k) {
  kind = k;
  try { localStorage.setItem('kind', k); } catch {}
  $('verb').textContent = KINDS[k].verb;
  document.title = top.lastChild.textContent = `文件${KINDS[k].verb}`;
  for (const b of $('mode').children) b.setAttribute('aria-selected', b.dataset.kind === k);
}
$('mode').onclick = (e) => e.target.dataset.kind && setKind(e.target.dataset.kind);
setKind(kind);

$('create').onsubmit = async (e) => {
  e.preventDefault();
  $('createBtn').disabled = true;
  const r = await fetch(KINDS[kind].api, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: $('title').value }),
  });
  const j = await r.json();
  if (!r.ok) {
    $('createBtn').disabled = false;
    return toast(j.error, 'bad');
  }
  location.href = `/${kind}/${j.code}`;
};

// A pasted link carries its own kind; a bare name uses the selected one.
$('join').onsubmit = (e) => {
  e.preventDefault();
  const m = $('code').value.trim().match(/(?:^|\/([cd])\/)([A-Za-z0-9]{1,32})\/?$/);
  if (!m) return toast('链接或名字无效', 'bad');
  location.href = `/${m[1] ?? kind}/${m[2]}`;
};

const [cs, ds] = await Promise.all(Object.values(KINDS).map(async ({ api }) => (await fetch(api)).json()));
const items = [
  ...cs.map((c) => ({ ...c, kind: 'c' })),
  ...ds.map((d) => ({ ...d, kind: 'd' })),
].sort((a, b) => b.expiresAt - a.expiresAt);
if (items.length) {
  $('recent').hidden = false;
  $('list').append(
    ...items.map((c) => {
      const role = c.isOwner ? '我发起的' : c.kind === 'c' ? '我加入的' : '我收到的';
      return h('a', { className: 'row-link', href: `/${c.kind}/${c.code}` },
        h('div', { className: 'grow' },
          h('div', { className: 'name' }, c.code),
          h('div', { className: 'chips', style: 'margin-top:4px' },
            h('span', { className: 'chip' }, KINDS[c.kind].verb),
            h('span', { className: `chip ${c.isOwner ? 'accent' : ''}` }, role))),
        h('span', { className: 'go' }, icon('arrow')));
    }),
  );
}
</script>
</body>
</html>
