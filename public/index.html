<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件收集</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <section class="hero">
    <h1>收集<em>文件</em></h1>
  </section>

  <div class="grid2">
    <form class="card" id="create">
      <h2>发起</h2>
      <input type="text" id="title" placeholder="标题" aria-label="标题" maxlength="100" required>
      <button class="btn primary block" id="createBtn">创建</button>
    </form>
    <form class="card" id="join">
      <h2>加入</h2>
      <input type="text" id="code" placeholder="链接或收集码" aria-label="链接或收集码" required autocomplete="off">
      <button class="btn block">加入</button>
    </form>
  </div>

  <section id="recent" hidden>
    <div class="section-title"><h2>我的收集</h2></div>
    <div class="rows" id="list"></div>
  </section>
</main>
<script type="module">
import { $, h, icon, brand, fmtRemaining, isUrgent, toast } from '/ui.js';

$('top').append(brand());

$('create').onsubmit = async (e) => {
  e.preventDefault();
  $('createBtn').disabled = true;
  const r = await fetch('/api/collections', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: $('title').value }),
  });
  const j = await r.json();
  if (!r.ok) {
    $('createBtn').disabled = false;
    return toast(j.error, 'bad');
  }
  location.href = '/c/' + j.code;
};

$('join').onsubmit = (e) => {
  e.preventDefault();
  const m = $('code').value.toLowerCase().match(/[a-z2-7]{8}(?![a-z2-7])/);
  if (!m) return toast('收集码无效', 'bad');
  location.href = '/c/' + m[0];
};

const items = await (await fetch('/api/collections')).json();
if (items.length) {
  $('recent').hidden = false;
  $('list').append(
    ...items.map((c) => {
      const left = c.expiresAt - Date.now();
      return h('a', { className: 'row-link', href: '/c/' + c.code },
        h('div', { className: 'grow' },
          h('div', { className: 'name' }, c.title),
          h('div', { className: 'chips', style: 'margin-top:4px' },
            h('span', { className: `chip ${c.isOwner ? 'accent' : ''}` }, c.isOwner ? '我发起的' : '我加入的'),
            h('span', { className: `chip ${isUrgent(left) ? 'warn' : ''}` }, icon('clock', 13), fmtRemaining(left)))),
        h('span', { className: 'go' }, icon('arrow')));
    }),
  );
}
</script>
</body>
</html>
