<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件收集</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="root"></main>
<script type="module">
import { $, h, icon, brand, avatar, fmtSize, fmtTime, toast, copyText, fileList, sumSize, picker, send } from '/ui.js';

const code = location.pathname.split('/')[2];
const api = '/api/collections/' + code;
const enc = (p) => p.split('/').map(encodeURIComponent).join('/');
const pending = new Map(); // relative path -> File

$('top').append(
  brand(),
  h('a', { className: 'back', href: '/' }, icon('back', 16), '首页'),
);

// ---- submit card ----

const els = {};
function buildSubmitCard() {
  els.mine = h('div', { hidden: true });
  els.pend = h('div', { className: 'pend', hidden: true });
  els.name = h('input', { type: 'text', placeholder: '管理者靠它认出你', maxLength: 50, required: true });
  els.submit = h('button', { className: 'btn primary block', disabled: true }, icon('upload', 16), '提交');
  els.bar = h('div', { className: 'bar', hidden: true }, h('i'));
  els.err = h('div', { className: 'err' });
  els.closedMsg = h('div', { className: 'muted', hidden: true, style: 'text-align:center;padding:24px 0' }, '收集已关闭');
  els.body = h('div', {},
    picker(addPending), els.pend,
    h('label', { className: 'field', style: 'margin-top:18px' }, h('span', {}, '你的姓名'), els.name),
    els.submit, els.bar, els.err,
    h('p', { className: 'hint' }, '再次提交会覆盖你之前的提交'));

  return h('form', { className: 'card', onsubmit: onSubmit },
    h('div', { className: 'card-head' }, h('h2', {}, '提交文件')),
    els.mine,
    els.closedMsg,
    els.body);
}

function addPending(entries) {
  for (const [p, f] of entries) pending.set(p, f);
  renderPending();
}

function renderPending() {
  const files = [...pending].map(([path, f]) => ({ path, size: f.size }));
  els.pend.hidden = !files.length;
  els.submit.disabled = !files.length;
  els.pend.replaceChildren(
    h('div', { className: 'pend-head' },
      h('span', {}, `已选 ${files.length} 个文件 · ${fmtSize(sumSize(files))}`),
      h('button', { type: 'button', className: 'btn ghost sm', onclick: () => { pending.clear(); renderPending(); } }, '清空')),
    fileList(files, { onRemove: (f) => { pending.delete(f.path); renderPending(); } }));
}

function onSubmit(e) {
  e.preventDefault();
  const fd = new FormData();
  fd.append('name', els.name.value);
  for (const [path, f] of pending) {
    fd.append('paths', path);
    fd.append('files', f);
  }
  try { localStorage.setItem('name', els.name.value); } catch {}

  els.err.textContent = '';
  els.submit.disabled = true;
  send(api + '/submit', fd, els.bar).then(({ error }) => {
    if (error) {
      els.submit.disabled = false;
      return (els.err.textContent = error);
    }
    pending.clear();
    renderPending();
    toast('提交成功');
    load();
  });
}

function renderMine(mine) {
  els.mine.hidden = !mine;
  if (!mine) return;
  els.name.value = mine.name;
  els.mine.className = 'mine-banner';
  els.mine.replaceChildren(
    icon('check', 20),
    h('div', { className: 'grow' },
      h('div', {}, `已提交 ${mine.files.length} 个文件 · ${fmtSize(sumSize(mine.files))}`),
      h('div', { className: 'muted', style: 'color:inherit;opacity:.8' }, `${mine.name} · ${fmtTime(mine.createdAt)}`),
      h('details', {}, h('summary', {}, '查看已提交的文件'), fileList(mine.files, { plain: true }))));
}

// ---- admin card ----

function stat(ic, k, v) {
  return h('div', { className: 'stat' }, h('div', { className: 'k' }, icon(ic, 14), k), h('div', { className: 'v' }, v));
}

function arm(btn, action) {
  let timer;
  btn.onclick = (e) => {
    e.preventDefault();
    if (btn.classList.toggle('armed')) {
      btn.lastChild.textContent = '确认删除';
      timer = setTimeout(() => { btn.classList.remove('armed'); btn.lastChild.textContent = '删除'; }, 3000);
    } else {
      clearTimeout(timer);
      action();
    }
  };
}

function subRow(s) {
  const del = h('button', { className: 'btn danger sm' }, icon('trash', 14), h('span', {}, '删除'));
  arm(del, async () => {
    await fetch(`${api}/submissions/${s.sid}`, { method: 'DELETE' });
    toast('已删除');
    loadAdmin();
  });
  return h('details', { className: 'sub' },
    h('summary', {},
      h('span', { className: 'chev' }, icon('chevron', 16)),
      avatar(s.name),
      h('div', { className: 'grow' },
        h('div', { className: 'nm' }, s.name),
        h('div', { className: 'muted' }, `${fmtTime(s.createdAt)} · ${s.files.length} 个文件 · ${fmtSize(sumSize(s.files))}`)),
      h('div', { className: 'ops' },
        h('a', { className: 'btn sm', href: `${api}/download?sid=${s.sid}` }, icon('download', 14), '下载'),
        del)),
    h('div', { className: 'body' }, fileList(s.files, { plain: true, hrefOf: (f) => `${api}/submissions/${s.sid}/files/${enc(f.path)}` })));
}

async function loadAdmin() {
  els.admin.hidden = false;
  const subs = await (await fetch(api + '/submissions')).json();
  const files = subs.flatMap((s) => s.files);
  els.admin.replaceChildren(
    h('div', { className: 'card-head' },
      h('h2', {}, '所有提交'),
      subs.length > 0 && h('a', { className: 'btn sm', href: api + '/download' }, icon('download', 14), '全部下载 .zip')),
    h('div', { className: 'stats' },
      stat('users', '提交人数', subs.length),
      stat('layers', '文件数', files.length),
      stat('hdd', '总大小', fmtSize(sumSize(files)))),
    ...(subs.length ? subs.map(subRow) : [h('div', { className: 'muted', style: 'text-align:center;padding:20px 0' }, '还没有人提交')]));
}

// ---- page ----

let info;

async function load() {
  const r = await fetch(api);
  if (!r.ok) {
    return $('root').replaceChildren(
      h('div', { className: 'empty' },
        h('h1', {}, '这个收集不存在'),
        h('a', { className: 'btn primary', href: '/' }, '回到首页')));
  }
  info = await r.json();
  document.title = info.title;
  els.title.textContent = info.title;
  els.role.className = `chip ${info.isOwner ? 'accent' : ''}`;
  els.role.textContent = info.isOwner ? '你是管理者' : '参与者';
  els.link.textContent = location.href;
  els.state.className = `chip ${info.closed ? '' : 'ok'}`;
  els.state.textContent = info.closed ? '已关闭' : '开放中';
  els.closeBtn.hidden = !info.isOwner;
  els.closeBtn.textContent = info.closed ? '重新开放' : '关闭收集';
  els.body.hidden = info.closed;
  els.closedMsg.hidden = !info.closed;
  renderMine(info.mine);
  if (!els.name.value) {
    try { els.name.value = localStorage.getItem('name') || ''; } catch {}
  }
  if (info.isOwner) loadAdmin();
}

Object.assign(els, {
  title: h('h1'),
  role: h('span'),
  state: h('span', { className: 'chip' }),
  closeBtn: h('button', { className: 'btn sm', hidden: true, onclick: toggleClosed }),
  link: h('code'),
  admin: h('section', { className: 'card', hidden: true }),
});
async function toggleClosed() {
  const r = await fetch(api + '/closed', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ closed: !info.closed }),
  });
  if (!r.ok) return toast('操作失败', 'bad');
  await load();
}

const copy = h('button', {
  className: 'btn sm primary',
  onclick: async () => {
    if (await copyText(location.href)) toast('链接已复制');
    else toast('复制失败，请手动复制', 'bad');
  },
}, icon('copy', 14), '复制');

$('root').append(
  h('div', { className: 'stack' },
    h('section', { className: 'head' },
      h('div', { className: 'chips' }, els.role, els.state, els.closeBtn),
      els.title,
      h('div', { className: 'share' }, icon('link', 16), els.link, copy)),
    buildSubmitCard(),
    els.admin));

await load();
</script>
</body>
</html>
